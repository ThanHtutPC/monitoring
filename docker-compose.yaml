services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9004:9090"
    volumes:
      # prometheus config 
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # targets nodes 
      - ./prometheus/targets:/etc/prometheus/targets:ro
      # alert_rules for when over 80%
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./prometheus/test_alert.yml:/etc/prometheus/test_alert.yml:ro
      # config persistent data
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks: [monitoring]

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "9001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: iadmin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9003:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks: [monitoring]

  calert:
    image: ghcr.io/mr-karan/calert:latest
    container_name: calert
    restart: unless-stopped
    ports:
      - "9002:6000" # Optional: only needed if you want to access it from the host
    volumes:
      - ./config.toml:/app/config.toml:ro 
      #- ./message.tmpl:/etc/calert/message.tmpl
    command: ["--config", "/app/config.toml"]
    networks: [monitoring]

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  monitoring:
    driver: bridge
