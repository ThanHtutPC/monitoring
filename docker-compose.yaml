services:
  nx-health-checker:
    image: nxera/nx-health-checker
    container_name: nx-health-checker
    ports:
      - "3030:3030"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=sqlite:./data/health_check.db?mode=rwc
      - HOST=0.0.0.0
      - PORT=3030
      - DEFAULT_USERNAME=innovix
      - DEFAULT_PASSWORD=inv@dmin123
      - PROMETHEUS_ENABLED=true
    volumes:
      - health_check_data:/app/data
    restart: unless-stopped
    networks:
      - nx-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # prometheus config 
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # targets nodes 
      - ./prometheus/targets:/etc/prometheus/targets:ro
      # alert_rules for when over 80%
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      # config persistent data
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=24h'
    depends_on:
      - nx-health-checker
    restart: unless-stopped
    networks:
      - nx-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "8000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=iadmin
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=mail.innovix-solutions.net:465
      - GF_SMTP_USER=noreply@innovix-solutions.net
      - GF_SMTP_PASSWORD=210485ddc1542748a2ab25b65c16bff8
      - GF_SMTP_FROM_NAME=noreply.innovix-solutions.net
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - nx-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager-for-monitoring
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks: 
      - nx-network

  calert:
    image: ghcr.io/mr-karan/calert:latest
    container_name: calert-monitoring
    restart: unless-stopped
    ports:
      - "6000:6000" # Optional: only needed if you want to access it from the host
    volumes:
      - ./config.toml:/app/config.toml:ro
        #- ./message.tmpl:/app/static/message.tmpl
    command: ["--config", "/app/config.toml"]
    networks: 
      - nx-network

volumes:
  health_check_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  nx-network:
    driver: bridge
