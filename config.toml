[app]
address = "0.0.0.0:6000"
server_timeout = "60s"
enable_request_logs = true
log = "info"

[providers.gchat]
type = "google_chat"
endpoint = <webhook_token>
max_idle_conns = 50
timeout = "30s"
template = "static/message.tmpl"
thread_ttl = "12h"
threaded_replies = false
dry_run = false
retry_max = 3
retry_wait_min = "1s"
retry_wait_max = "5s"
