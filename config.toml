[app]
address = "0.0.0.0:6000"
server_timeout = "60s"
enable_request_logs = true
log = "info"

[providers.gchat]
type = "google_chat"
endpoint = "https://chat.googleapis.com/v1/spaces/AAQAAE7izpU/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=pt-2mNyCUUJggbyRzxewyIOhH_jGE-0rL0TJReLN4hA"
max_idle_conns = 50
timeout = "30s"
template = "static/message.tmpl"
thread_ttl = "12h"
threaded_replies = false
dry_run = false
retry_max = 3
retry_wait_min = "1s"
retry_wait_max = "5s"
