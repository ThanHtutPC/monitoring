global:
  scrape_interval: 15s

scrape_configs:
  # Scrape the NX Health Checker app
  - job_name: "health_check"
    static_configs:
      - targets: ["nx-health-checker:3030"]

  - job_name: 'nodes'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/*.json']
        refresh_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml
  - /etc/prometheus/test_alert.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
